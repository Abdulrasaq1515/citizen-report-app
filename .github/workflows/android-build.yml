name: Android CI (Cordova)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /opt/hostedtoolcache/jdk/11/x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set ANDROID_SDK_ROOT
        run: echo "ANDROID_SDK_ROOT=${{ runner.temp }}/android-sdk" >> $GITHUB_ENV



      - name: Install Android command-line tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/ || true

      - name: Accept licenses and install SDK packages
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Add Android tools to PATH
        run: |
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Cordova CLI
        run: npm install -g cordova@11

      - name: Prepare Android platform
        run: |
          cd $GITHUB_WORKSPACE
          cordova platform add android || true

      - name: Patch plugin Gradle files and ensure compileSdk
        run: |
          set -e
          echo "Patching plugin Gradle files: replacing 'compile' with 'implementation'"
          find platforms/android -type f -name "*.gradle" -print0 | xargs -0 sed -i 's/\bcompile\b/implementation/g' || true

          APP_BUILD_GRADLE=platforms/android/app/build.gradle
          if [ -f "$APP_BUILD_GRADLE" ]; then
            if ! grep -q "compileSdkVersion" "$APP_BUILD_GRADLE"; then
              echo "Inserting compileSdkVersion 33 into $APP_BUILD_GRADLE"
              perl -0777 -pe "s/android\s*\{/android {\n        compileSdkVersion 33\n/" -i "$APP_BUILD_GRADLE"
            else
              echo "compileSdkVersion already present"
            fi
          else
            echo "$APP_BUILD_GRADLE not found; skipping compileSdk insertion"
          fi

      - name: Build Android debug APK
        run: |
          cd $GITHUB_WORKSPACE
          cordova build android --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
